name: apk

# Release tags build the signed APK and attach it to the GitHub release.
# Pull requests that touch the app, and manual runs, only build it to catch breakage.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths: ["app/**", ".github/workflows/apk.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: false
      - name: generate the Flutter project
        run: ./app/setup.sh
      # Without the signing secrets the build falls back to the debug key.
      # That is fine for test runs, but a release tag must never ship it, because
      # users could not update in place over an APK signed with a different key.
      - name: signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
              echo "::error::ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD secrets are required for a release"
              exit 1
            fi
            echo "::warning::no signing secrets, building with the debug key"
            exit 0
          fi
          cd app/xpadlink_app/android
          echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
          printf 'storeFile=release.keystore\nstorePassword=%s\nkeyAlias=xpadlink\nkeyPassword=%s\n' \
            "$KEYSTORE_PASSWORD" "$KEYSTORE_PASSWORD" > key.properties
      - name: build
        working-directory: app/xpadlink_app
        run: flutter build apk --release
      - name: rename
        run: cp app/xpadlink_app/build/app/outputs/flutter-apk/app-release.apk xpadlink.apk
      # The release is created by GoReleaser in ci.yml, which may still be running.
      - name: attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 60); do
            gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 && break
            echo "waiting for release $GITHUB_REF_NAME ($i)"; sleep 15
          done
          gh release upload "$GITHUB_REF_NAME" xpadlink.apk --clobber
      # Test runs keep the APK for one day only, to spare Actions storage.
      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        with:
          name: xpadlink-apk
          path: xpadlink.apk
          retention-days: 1
